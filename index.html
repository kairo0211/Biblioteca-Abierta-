
<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Biblioteca Abierta</title>

<script src="https://cdn.jsdelivr.net/npm/epubjs@0.3.93/dist/epub.min.js"></script>

<style>
*{box-sizing:border-box}
body{margin:0;background:#f5f1e8;color:#24352d;font-family:Arial}
header,footer{background:#123b2c;color:white;padding:22px;text-align:center}
main{max-width:1100px;margin:auto;padding:20px}
input,select,textarea,button{padding:12px;border-radius:7px;border:1px solid #ccc;font-size:15px}
button{cursor:pointer;font-weight:bold}
.catalogo{display:grid;grid-template-columns:repeat(auto-fit,minmax(210px,1fr));gap:18px}
.libro{background:white;border-radius:10px;overflow:hidden;padding-bottom:15px}
.portada{height:240px;background:linear-gradient(140deg,#174b36,#bd9847);color:white;display:flex;align-items:center;justify-content:center;text-align:center;padding:15px;font-size:23px}
.libro-info{padding:15px}
.acciones{display:flex;gap:7px;flex-wrap:wrap}
.leer{background:#174b36;color:white}
.eliminar{background:#f4e4e0;color:#8d3025}
.descargar{background:#eee7d8;color:#24352d;text-decoration:none;padding:12px;border-radius:7px;font-weight:bold}
#formulario{display:none;background:white;padding:18px;margin:20px 0;border-radius:10px}
#formulario input,#formulario select,#formulario textarea{width:100%;margin:6px 0 12px}
#modalLector{display:none;position:fixed;inset:0;background:#000c;z-index:9999;padding:10px}
.lector{background:white;width:100%;max-width:1000px;height:100%;margin:auto;display:flex;flex-direction:column;border-radius:10px;overflow:hidden}
.barra{background:#123b2c;color:white;padding:12px;display:flex;gap:8px;align-items:center;flex-wrap:wrap}
.barra strong{flex:1}
.barra button{background:#bd9847;color:#172c22}
#estado{padding:10px;background:#f5f1e8;font-size:14px}
#visor{flex:1;min-height:0;width:100%;background:white;overflow:auto}
#visor iframe{border:0}
@media(max-width:550px){
 #modalLector{padding:0}
 .lector{border-radius:0}
 .barra strong{flex-basis:100%}
 .barra button{flex:1}
}
</style>
</head>

<body>

<header>
<h1>📚 Biblioteca Abierta</h1>
<p>Un mundo de historias por descubrir</p>
</header>

<main>

<h2>Buscar libros</h2>

<input id="busqueda" placeholder="Buscar por título o autor..." oninput="mostrarLibros()">
<select id="filtro" onchange="mostrarLibros()">
<option value="">Todas las categorías</option>
<option>Novela</option>
<option>Romance</option>
<option>Misterio</option>
<option>Historia</option>
<option>Otros</option>
</select>

<button onclick="abrirFormulario()">+ Agregar libro</button>

<section id="formulario">
<h3>Agregar libro</h3>
<input id="titulo" placeholder="Título">
<input id="autor" placeholder="Autor">
<select id="categoria">
<option>Novela</option>
<option>Romance</option>
<option>Misterio</option>
<option>Historia</option>
<option>Otros</option>
</select>
<input id="archivo" type="file" accept=".epub,.pdf">
<textarea id="descripcion" placeholder="Descripción"></textarea>
<button onclick="guardarLibro()">Guardar</button>
<button onclick="cerrarFormulario()">Cancelar</button>
</section>

<h2>Catálogo</h2>
<div id="catalogo" class="catalogo"></div>

</main>

<footer>Biblioteca Abierta</footer>

<div id="modalLector">
<div class="lector">
<div class="barra">
<strong id="tituloLector">Leyendo libro</strong>
<button onclick="anterior()">← Anterior</button>
<button onclick="siguiente()">Siguiente →</button>
<button onclick="cerrarLector()">Cerrar ✕</button>
</div>
<div id="estado">Preparando libro...</div>
<div id="visor"></div>
</div>
</div>

<script>
const ARCHIVO_DIABLO =
"El_Diablo_Ilustrado_El_Diablo_Ilustrado_Ilustrado,_El_Diablo_.epub";

const CLAVE = "bibliotecaAbiertaLibros";

let libros = [];
let libroEPUB = null;
let lectorEPUB = null;

function cargarLibros(){
  try{
    const datos = localStorage.getItem(CLAVE);
    libros = datos ? JSON.parse(datos) : [];
    if(!Array.isArray(libros)) libros = [];
  }catch(e){
    libros = [];
  }

  if(!libros.some(l =>
    (l.titulo || "").toLowerCase() === "el diablo ilustrado"
  )){
    libros.push({
      id:"diablo-ilustrado",
      titulo:"El Diablo Ilustrado",
      autor:"Anónimo / Por confirmar",
      categoria:"Otros",
      descripcion:"Libro en formato EPUB",
      formato:"EPUB",
      archivoUrl:ARCHIVO_DIABLO
    });
  }

  libros = libros.map((l,i)=>({
    ...l,
    id:l.id || ("libro-"+i+"-"+Date.now())
  }));

  guardarDatos();
}

function guardarDatos(){
  localStorage.setItem(CLAVE,JSON.stringify(libros));
}

function rutaArchivo(nombre){
  if(/^https?:\/\//i.test(nombre)) return nombre;

  return new URL(
    nombre.split("/").map(encodeURIComponent).join("/"),
    document.baseURI
  ).href;
}

function mostrarLibros(){
  const zona = document.getElementById("catalogo");
  const texto = document.getElementById("busqueda").value.toLowerCase();
  const categoria = document.getElementById("filtro").value;

  zona.innerHTML = "";

  const encontrados = libros.filter(l =>
    ((l.titulo||"").toLowerCase().includes(texto) ||
     (l.autor||"").toLowerCase().includes(texto)) &&
    (!categoria || l.categoria === categoria)
  );

  if(!encontrados.length){
    zona.textContent = "No hay libros disponibles.";
    return;
  }

  encontrados.forEach(l=>{
    const tarjeta = document.createElement("article");
    tarjeta.className = "libro";

    const portada = document.createElement("div");
    portada.className = "portada";
    portada.textContent = l.titulo;

    const info = document.createElement("div");
    info.className = "libro-info";

    const autor = document.createElement("p");
    autor.textContent = l.autor || "";

    const descripcion = document.createElement("p");
    descripcion.textContent = l.descripcion || "";

    const acciones = document.createElement("div");
    acciones.className = "acciones";

    const leer = document.createElement("button");
    leer.className = "leer";
    leer.textContent = "Leer libro";
    leer.onclick = ()=>abrirLibro(l);

    const eliminar = document.createElement("button");
    eliminar.className = "eliminar";
    eliminar.textContent = "Eliminar";
    eliminar.onclick = ()=>eliminarLibro(l.id);

    acciones.append(leer,eliminar);
    info.append(autor,descripcion,acciones);
    tarjeta.append(portada,info);
    zona.appendChild(tarjeta);
  });
}

function abrirFormulario(){
  document.getElementById("formulario").style.display = "block";
}

function cerrarFormulario(){
  document.getElementById("formulario").style.display = "none";
}

function guardarLibro(){
  const titulo = document.getElementById("titulo").value.trim();
  const autor = document.getElementById("autor").value.trim();
  const archivo = document.getElementById("archivo").files[0];

  if(!titulo || !autor || !archivo){
    alert("Completa título, autor y archivo.");
    return;
  }

  const extension = archivo.name.toLowerCase().endsWith(".pdf")
    ? "PDF" : archivo.name.toLowerCase().endsWith(".epub")
    ? "EPUB" : "";

  if(!extension){
    alert("El archivo debe ser EPUB o PDF.");
    return;
  }

  libros.push({
    id:"libro-"+Date.now(),
    titulo,
    autor,
    categoria:document.getElementById("categoria").value,
    descripcion:document.getElementById("descripcion").value,
    formato:extension,
    archivoUrl:archivo.name
  });

  guardarDatos();
  mostrarLibros();
  cerrarFormulario();

  alert("Ficha guardada. Sube también el archivo a GitHub.");
}

function eliminarLibro(id){
  const libro = libros.find(l=>String(l.id)===String(id));
  if(!libro) return;

  if(!confirm("¿Eliminar "+libro.titulo+"?")) return;

  libros = libros.filter(l=>String(l.id)!==String(id));
  guardarDatos();
  mostrarLibros();
}

/* LECTOR DE LIBROS */

async function abrirLibro(libro){

  cerrarLector();

  const modal = document.getElementById("modalLector");
  const visor = document.getElementById("visor");
  const estado = document.getElementById("estado");

  document.getElementById("tituloLector").textContent = libro.titulo;
  modal.style.display = "block";
  estado.textContent = "Descargando el libro para preparar sus páginas...";

  const url = rutaArchivo(libro.archivoUrl);
  const formato = (libro.formato || "").toUpperCase();

  try{

    if(formato === "PDF"){
      const iframe = document.createElement("iframe");
      iframe.src = url;
      iframe.style.width = "100%";
      iframe.style.height = "100%";
      visor.appendChild(iframe);
      estado.textContent = "";
      return;
    }

    if(typeof ePub !== "function"){
      throw new Error("No se pudo cargar el motor EPUB. Comprueba Internet.");
    }

    // DESCARGAR EL ARCHIVO COMO DATOS BINARIOS
    const respuesta = await fetch(url);

    if(!respuesta.ok){
      throw new Error("No se encontró el archivo EPUB. Código: "+respuesta.status);
    }

    const datos = await respuesta.arrayBuffer();

    if(datos.byteLength < 100){
      throw new Error("El archivo EPUB está vacío o incompleto.");
    }

    estado.textContent = "Cargando las páginas del libro...";

    // ENTREGAR LOS DATOS BINARIOS A EPUB.JS
    libroEPUB = ePub(datos);

    await libroEPUB.ready;

    // CREAR EL VISOR DENTRO DE LA PÁGINA
    lectorEPUB = libroEPUB.renderTo(visor,{
      width:"100%",
      height:"100%",
      spread:"none",
      flow:"scrolled-doc"
    });

    // MOSTRAR LA PRIMERA PÁGINA
    await lectorEPUB.display();

    estado.textContent = "";

  }catch(error){

    console.error(error);

    estado.textContent =
      "Error al abrir el libro: "+error.message;

  }
}

function anterior(){
  if(lectorEPUB) lectorEPUB.prev();
}

function siguiente(){
  if(lectorEPUB) lectorEPUB.next();
}

function cerrarLector(){

  if(lectorEPUB){
    try{lectorEPUB.destroy();}catch(e){}
  }

  if(libroEPUB){
    try{libroEPUB.destroy();}catch(e){}
  }

  lectorEPUB = null;
  libroEPUB = null;

  document.getElementById("visor").innerHTML = "";
  document.getElementById("modalLector").style.display = "none";
  document.getElementById("estado").textContent = "";
}

cargarLibros();
mostrarLibros();

</script>
</body>
</html>
