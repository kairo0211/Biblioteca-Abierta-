
<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Biblioteca Abierta</title>

<!-- Motor para leer libros EPUB -->
<script src="https://cdn.jsdelivr.net/npm/epubjs@0.3.93/dist/epub.min.js"></script>

<style>
* {
  box-sizing: border-box;
}

body {
  margin: 0;
  background: #f5f1e8;
  color: #24352d;
  font-family: Arial, sans-serif;
}

header, footer {
  background: #123b2c;
  color: white;
  padding: 22px;
  text-align: center;
}

main {
  max-width: 1100px;
  margin: auto;
  padding: 20px;
}

input, select, textarea, button {
  padding: 12px;
  border-radius: 7px;
  border: 1px solid #ccc;
  font-size: 15px;
}

button {
  cursor: pointer;
  font-weight: bold;
}

.catalogo {
  display: grid;
  grid-template-columns: repeat(auto-fit, minmax(210px, 1fr));
  gap: 18px;
}

.libro {
  background: white;
  border-radius: 10px;
  overflow: hidden;
  padding-bottom: 15px;
}

.portada {
  height: 240px;
  background: linear-gradient(140deg, #174b36, #bd9847);
  color: white;
  display: flex;
  align-items: center;
  justify-content: center;
  text-align: center;
  padding: 15px;
  font-size: 23px;
}

.libro-info {
  padding: 15px;
}

.acciones {
  display: flex;
  gap: 7px;
  flex-wrap: wrap;
}

.leer {
  background: #174b36;
  color: white;
}

.eliminar {
  background: #f4e4e0;
  color: #8d3025;
}

#formulario {
  display: none;
  background: white;
  padding: 18px;
  margin: 20px 0;
  border-radius: 10px;
}

#formulario input,
#formulario select,
#formulario textarea {
  width: 100%;
  margin: 6px 0 12px;
}

#modalLector {
  display: none;
  position: fixed;
  inset: 0;
  background: #000c;
  z-index: 9999;
  padding: 10px;
}

.lector {
  background: white;
  width: 100%;
  max-width: 1000px;
  height: 100%;
  min-height: 0;
  margin: auto;
  display: flex;
  flex-direction: column;
  border-radius: 10px;
  overflow: hidden;
}

.barra {
  background: #123b2c;
  color: white;
  padding: 12px;
  display: flex;
  gap: 8px;
  align-items: center;
  flex-wrap: wrap;
}

.barra strong {
  flex: 1;
}

.barra button {
  background: #bd9847;
  color: #172c22;
}

#estado {
  padding: 10px;
  background: #f5f1e8;
  font-size: 14px;
  flex-shrink: 0;
}

#visor {
  flex: 1 1 auto;
  min-height: 0;
  height: 0;
  width: 100%;
  background: white;
  overflow: auto;
}

#visor iframe {
  border: 0;
  display: block;
  width: 100%;
  height: 100%;
}

#visor iframe,
#visor > div {
  max-width: 100%;
}

@media(max-width: 550px) {
  #modalLector {
    padding: 0;
  }

  .lector {
    border-radius: 0;
  }

  .barra strong {
    flex-basis: 100%;
  }

  .barra button {
    flex: 1;
  }
}
</style>
</head>

<body>

<header>
  <h1>📚 Biblioteca Abierta</h1>
  <p>Un mundo de historias por descubrir</p>
</header>

<main>

  <h2>Buscar libros</h2>

  <input
    id="busqueda"
    placeholder="Buscar por título o autor..."
    oninput="mostrarLibros()"
  >

  <select id="filtro" onchange="mostrarLibros()">
    <option value="">Todas las categorías</option>
    <option>Novela</option>
    <option>Romance</option>
    <option>Misterio</option>
    <option>Historia</option>
    <option>Otros</option>
  </select>

  <button onclick="abrirFormulario()">+ Agregar libro</button>

  <section id="formulario">
    <h3>Agregar libro</h3>

    <input id="titulo" placeholder="Título">
    <input id="autor" placeholder="Autor">

    <select id="categoria">
      <option>Novela</option>
      <option>Romance</option>
      <option>Misterio</option>
      <option>Historia</option>
      <option>Otros</option>
    </select>

    <input id="archivo" type="file" accept=".epub,.pdf">

    <textarea id="descripcion" placeholder="Descripción"></textarea>

    <button onclick="guardarLibro()">Guardar</button>
    <button onclick="cerrarFormulario()">Cancelar</button>
  </section>

  <h2>Catálogo</h2>

  <div id="catalogo" class="catalogo"></div>

</main>

<footer>
  Biblioteca Abierta
</footer>

<!-- VENTANA DEL LECTOR -->
<div id="modalLector">

  <div class="lector">

    <div class="barra">
      <strong id="tituloLector">Leyendo libro</strong>

      <button onclick="anterior()">← Anterior</button>
      <button onclick="siguiente()">Siguiente →</button>
      <button onclick="cerrarLector()">Cerrar ✕</button>
    </div>

    <div id="estado">Preparando libro...</div>

    <div id="visor"></div>

  </div>

</div>

<script>

/* CONFIGURACIÓN */

const ARCHIVO_DIABLO =
"El_Diablo_Ilustrado_El_Diablo_Ilustrado_Ilustrado,_El_Diablo_.epub";

const CLAVE = "bibliotecaAbiertaLibros";

let libros = [];
let libroEPUB = null;
let lectorEPUB = null;
let solicitudActual = 0;


/* CARGAR LIBROS */

function cargarLibros() {

  try {
    const datos = localStorage.getItem(CLAVE);

    libros = datos ? JSON.parse(datos) : [];

    if (!Array.isArray(libros)) {
      libros = [];
    }

  } catch(e) {
    libros = [];
  }

  // Añadir el libro inicial si todavía no existe
  if (!libros.some(l =>
    (l.titulo || "").toLowerCase() === "el diablo ilustrado"
  )) {

    libros.push({
      id: "diablo-ilustrado",
      titulo: "El Diablo Ilustrado",
      autor: "Anónimo / Por confirmar",
      categoria: "Otros",
      descripcion: "Libro en formato EPUB",
      formato: "EPUB",
      archivoUrl: ARCHIVO_DIABLO
    });
  }

  libros = libros.map((l, i) => ({
    ...l,
    id: l.id || ("libro-" + i + "-" + Date.now())
  }));

  guardarDatos();
}


/* GUARDAR DATOS */

function guardarDatos() {

  try {
    localStorage.setItem(CLAVE, JSON.stringify(libros));
  } catch(e) {
    alert("No se pudieron guardar los datos en este dispositivo.");
  }

}


/* CONSTRUIR DIRECCIÓN DEL ARCHIVO */

function rutaArchivo(nombre) {

  if (/^https?:\/\//i.test(nombre)) {
    return nombre;
  }

  return new URL(
    nombre.split("/").map(encodeURIComponent).join("/"),
    document.baseURI
  ).href;
}


/* MOSTRAR CATÁLOGO */

function mostrarLibros() {

  const zona = document.getElementById("catalogo");

  const texto = document
    .getElementById("busqueda")
    .value.toLowerCase();

  const categoria = document.getElementById("filtro").value;

  zona.innerHTML = "";

  const encontrados = libros.filter(l =>

    (
      (l.titulo || "").toLowerCase().includes(texto) ||
      (l.autor || "").toLowerCase().includes(texto)
    ) &&
    (!categoria || l.categoria === categoria)

  );

  if (!encontrados.length) {
    zona.textContent = "No hay libros disponibles.";
    return;
  }

  encontrados.forEach(l => {

    const tarjeta = document.createElement("article");
    tarjeta.className = "libro";

    const portada = document.createElement("div");
    portada.className = "portada";
    portada.textContent = l.titulo;

    const info = document.createElement("div");
    info.className = "libro-info";

    const autor = document.createElement("p");
    autor.textContent = l.autor || "";

    const descripcion = document.createElement("p");
    descripcion.textContent = l.descripcion || "";

    const acciones = document.createElement("div");
    acciones.className = "acciones";

    const leer = document.createElement("button");
    leer.className = "leer";
    leer.textContent = "Leer libro";
    leer.onclick = () => abrirLibro(l);

    const eliminar = document.createElement("button");
    eliminar.className = "eliminar";
    eliminar.textContent = "Eliminar";
    eliminar.onclick = () => eliminarLibro(l.id);

    acciones.append(leer, eliminar);

    info.append(autor, descripcion, acciones);

    tarjeta.append(portada, info);

    zona.appendChild(tarjeta);

  });

}


/* FORMULARIO */

function abrirFormulario() {

  document.getElementById("formulario").style.display = "block";

}

function cerrarFormulario() {

  document.getElementById("formulario").style.display = "none";

}


/* GUARDAR LIBRO */

function guardarLibro() {

  const titulo = document.getElementById("titulo").value.trim();

  const autor = document.getElementById("autor").value.trim();

  const archivo = document.getElementById("archivo").files[0];

  if (!titulo || !autor || !archivo) {
    alert("Completa título, autor y archivo.");
    return;
  }

  const extension = archivo.name.toLowerCase().endsWith(".pdf")
    ? "PDF"
    : archivo.name.toLowerCase().endsWith(".epub")
    ? "EPUB"
    : "";

  if (!extension) {
    alert("El archivo debe ser EPUB o PDF.");
    return;
  }

  libros.push({

    id: "libro-" + Date.now(),

    titulo,

    autor,

    categoria: document.getElementById("categoria").value,

    descripcion: document.getElementById("descripcion").value,

    formato: extension,

    archivoUrl: archivo.name

  });

  guardarDatos();

  mostrarLibros();

  cerrarFormulario();

  document.getElementById("titulo").value = "";
  document.getElementById("autor").value = "";
  document.getElementById("archivo").value = "";
  document.getElementById("descripcion").value = "";

  alert(
    "Ficha guardada. Recuerda subir también el archivo EPUB o PDF a GitHub."
  );

}


/* ELIMINAR LIBRO */

function eliminarLibro(id) {

  const libro = libros.find(l => String(l.id) === String(id));

  if (!libro) return;

  if (!confirm("¿Eliminar " + libro.titulo + "?")) return;

  libros = libros.filter(l => String(l.id) !== String(id));

  guardarDatos();

  mostrarLibros();

}


/* ESPERAR A QUE EL VISOR ESTÉ LISTO */

function esperarVisor() {

  return new Promise(resolve => {

    requestAnimationFrame(() => {

      requestAnimationFrame(resolve);

    });

  });

}


/* CERRAR Y LIMPIAR EL LIBRO ANTERIOR */

function limpiarLibroAnterior() {

  if (lectorEPUB) {
    try {
      lectorEPUB.destroy();
    } catch(e) {}
  }

  if (libroEPUB) {
    try {
      libroEPUB.destroy();
    } catch(e) {}
  }

  lectorEPUB = null;
  libroEPUB = null;

  document.getElementById("visor").innerHTML = "";

}


/* ABRIR LIBRO */

async function abrirLibro(libro) {

  // Identificador para evitar que una carga anterior
  // interfiera con la apertura de otro libro.
  const miSolicitud = ++solicitudActual;

  limpiarLibroAnterior();

  const modal = document.getElementById("modalLector");

  const visor = document.getElementById("visor");

  const estado = document.getElementById("estado");

  document.getElementById("tituloLector").textContent = libro.titulo;

  modal.style.display = "block";

  visor.innerHTML = "";

  estado.style.display = "block";

  estado.textContent = "Preparando el lector...";

  const url = rutaArchivo(libro.archivoUrl);

  const formato = (libro.formato || "").toUpperCase();

  try {

    // LIBROS PDF

    if (formato === "PDF") {

      estado.textContent = "Abriendo el PDF...";

      const iframe = document.createElement("iframe");

      iframe.src = url;

      iframe.title = libro.titulo;

      visor.appendChild(iframe);

      estado.textContent = "";

      return;
    }


    // COMPROBAR EL MOTOR EPUB

    if (typeof ePub !== "function") {

      throw new Error(
        "No se pudo cargar EPUB.js. Comprueba tu conexión a Internet."
      );

    }


    // ESPERAR A QUE LA VENTANA DEL LECTOR ESTÉ VISIBLE

    await esperarVisor();

    if (miSolicitud !== solicitudActual) return;


    // DESCARGAR EL ARCHIVO CON UN LÍMITE DE TIEMPO

    estado.textContent = "Descargando el archivo del libro...";

    const controlador = new AbortController();

    const limite = setTimeout(() => {
      controlador.abort();
    }, 90000);

    let respuesta;

    try {

      respuesta = await fetch(url, {
        method: "GET",
        cache: "no-store",
        signal: controlador.signal
      });

    } finally {

      clearTimeout(limite);

    }

    if (miSolicitud !== solicitudActual) return;

    if (!respuesta.ok) {

      throw new Error(
        "No se pudo descargar el libro. Código: " + respuesta.status
      );

    }


    // CONVERTIR EL ARCHIVO A DATOS BINARIOS

    estado.textContent = "Preparando las páginas del libro...";

    const datos = await respuesta.arrayBuffer();

    if (miSolicitud !== solicitudActual) return;

    if (!datos || datos.byteLength < 100) {

      throw new Error("El archivo EPUB está vacío o incompleto.");

    }


    // COMPROBAR QUE ES UN ARCHIVO EPUB ZIP

    const firma = new Uint8Array(datos, 0, 4);

    if (
      firma[0] !== 0x50 ||
      firma[1] !== 0x4b
    ) {

      throw new Error(
        "El archivo recibido no parece ser un EPUB válido."
      );

    }


    // PREPARAR EL LIBRO

    estado.textContent = "Abriendo el libro y preparando sus páginas...";

    libroEPUB = ePub(datos);

    await libroEPUB.ready;

    if (miSolicitud !== solicitudActual) return;


    // ASEGURAR QUE EL VISOR TENGA TAMAÑO

    await esperarVisor();

    if (miSolicitud !== solicitudActual) return;

    if (visor.clientHeight < 50) {

      throw new Error(
        "El espacio del lector no tiene altura suficiente."
      );

    }


    // CREAR EL VISOR EPUB

    lectorEPUB = libroEPUB.renderTo(visor, {

      width: "100%",

      height: "100%",

      spread: "none",

      flow: "paginated"

    });


    // MOSTRAR LA PRIMERA PÁGINA

    estado.textContent = "Cargando la primera página...";

    await lectorEPUB.display();

    if (miSolicitud !== solicitudActual) return;

    estado.style.display = "none";


  } catch(error) {

    if (miSolicitud !== solicitudActual) return;

    console.error("Error al abrir el libro:", error);

    estado.style.display = "block";

    if (error.name === "AbortError") {

      estado.textContent =
        "La descarga tardó demasiado. Comprueba tu conexión e inténtalo otra vez.";

    } else {

      estado.textContent =
        "No se pudo abrir el libro: " + error.message;

    }

  }

}


/* PÁGINA ANTERIOR */

function anterior() {

  if (lectorEPUB) {

    lectorEPUB.prev();

  }

}


/* PÁGINA SIGUIENTE */

function siguiente() {

  if (lectorEPUB) {

    lectorEPUB.next();

  }

}


/* CERRAR LECTOR */

function cerrarLector() {

  solicitudActual++;

  limpiarLibroAnterior();

  document.getElementById("modalLector").style.display = "none";

  document.getElementById("estado").textContent = "";

  document.getElementById("estado").style.display = "block";

}


/* INICIAR BIBLIOTECA */

cargarLibros();

mostrarLibros();

</script>

</body>
</html>
